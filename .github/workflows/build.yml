name: Build Unity Project

on:
  push:
    branches:
      - main
    # Pushing a tag such as v1.5.0 also publishes the APK as a GitHub Release.
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release on tag pushes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Free Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "Disk space after cleanup:"
          df -h

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Read the editor version from ProjectSettings/ProjectVersion.txt so
          # CI never drifts from the version the project is saved with.
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BuildCommand.BuildAndroid

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-Meta-Quest3-Android-Build
          path: Builds/Android/IRIS-Meta-Quest3.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Builds/Android/IRIS-Meta-Quest3.apk
          generate_release_notes: true
